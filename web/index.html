<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeXperiment</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathlive@0.111.4/mathlive-static.css">
<script async src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/mathlive@0.111.4/mathlive.min.js"></script>
<script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
<link rel="stylesheet" href="/style.css?v=6">
</head>
<body>
<div id="banner" class="hidden"></div>
<div id="compiling" class="hidden"></div>
<div id="layout">
  <aside id="sidebar">
    <h1 class="brand">TeX<span>periment</span></h1>
    <div id="conn" class="conn conn-off">connecting…</div>
    <div id="edtoolbar">
      <button id="undobtn" title="Undo last change (Ctrl+Z)" disabled>↩ Undo</button>
      <button id="redobtn" title="Redo (Ctrl+Shift+Z or Ctrl+Y)" disabled>↪ Redo</button>
      <button id="themebtn" title="Switch between dark and light mode">☀</button>
    </div>
    <div class="sb-head sb-headrow" id="projHead"><span>Project</span><button id="projadd" title="Add project from disk">＋</button></div>
    <div id="projlist"></div>
    <div class="sb-head" id="filesHead">Files</div>
    <div id="filelist"></div>
    <div class="sb-head" id="outlineHead">Outline</div>
    <div id="outline"></div>
    <div class="sb-head" id="gitHead">Source Control</div>
    <div id="gitpanel"></div>
    <div class="sb-head" id="proofHead">Proofreading</div>
    <div id="proofpanel"></div>
  </aside>
  <main id="content"></main>
</div>
<div id="browsemodal" class="hidden"></div>
<div id="gitmodal" class="hidden"></div>
<div id="toast" class="hidden"></div>
<script defer src="/app.js?v=12"></script>
</body>
</html>
