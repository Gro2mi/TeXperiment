<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeXperiment</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathlive@0.111.4/mathlive-static.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathlive@0.111.4/mathlive.min.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="banner" class="hidden"></div>
<div id="layout">
  <aside id="sidebar">
    <h1 class="brand">TeX<span>periment</span></h1>
    <div id="conn" class="conn conn-off">connecting…</div>
    <div class="sb-head">Project</div>
    <div id="projbar">
      <select id="projsel" title="Switch project"></select>
      <button id="projadd" title="Add project from disk">＋</button>
      <button id="projcompile" title="Compile LaTeX and view the PDF (needs a TeX installation)">PDF</button>
      <button id="projdel" title="Remove current project">✕</button>
    </div>
    <div class="sb-head" id="filesHead">Files</div>
    <div id="filelist"></div>
    <div class="sb-head" id="outlineHead">Outline</div>
    <div id="outline"></div>
  </aside>
  <main id="content"></main>
</div>
<div id="browsemodal" class="hidden"></div>
<div id="toast" class="hidden"></div>
<script defer src="/app.js"></script>
</body>
</html>
